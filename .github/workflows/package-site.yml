name: Package APTREDLIGHT static website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'catalog.html'
      - 'quality-process.html'
      - 'rfq.html'
      - 'resources/**'
      - 'assets/**'
      - 'guides/**'
      - 'products/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/package-site.yml'
  workflow_dispatch:
concurrency:
  group: aptredlight-static-release-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate site
        run: |
          test -f index.html
          test -s resources/oem-private-label-buyers-checklist.pdf
          test -f rfq.html
          test -f assets/style.css
          test -f assets/main.js
          test -f guides/oem-odm-buyer-guide.html
          grep -q 'www.aptredlight.com' index.html
      - name: Verify bundled product photos
        run: |
          for photo in aptredlight-brand-banner.jpg aptredlight-therapy-panel.jpg aptredlight-touch-button-panel.webp aptredlight-sleeping-bag.jpg aptredlight-full-body-lamp.png; do
            test -s "assets/photos/$photo"
          done
      - name: Create deploy archive
        run: |
          zip -q -r aptredlight-live.zip index.html catalog.html quality-process.html rfq.html resources assets guides products robots.txt sitemap.xml
          unzip -l aptredlight-live.zip
      - name: Store refreshed archive with concurrent-update safety
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -f aptredlight-live.zip
            zip -q -r aptredlight-live.zip index.html catalog.html quality-process.html rfq.html resources assets guides products robots.txt sitemap.xml
            git add -f aptredlight-live.zip
            if git diff --cached --quiet; then echo "Release is already current"; exit 0; fi
            git commit -m "Build updated static release archive [skip ci]"
            if git push origin HEAD:main; then
              echo "Release committed to GitHub"
              exit 0
            fi
            sleep 2
          done
          echo "Failed to publish archive after retrying"
          exit 1

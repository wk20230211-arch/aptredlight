name: Package APTREDLIGHT static website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'guides/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/package-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate site
        run: |
          test -f index.html
          test -f assets/style.css
          test -f assets/main.js
          test -f guides/oem-odm-buyer-guide.html
          grep -q 'www.aptredlight.com' index.html
      - name: Verify bundled product photos
        run: |
          for photo in aptredlight-brand-banner.jpg aptredlight-therapy-panel.jpg aptredlight-touch-button-panel.webp aptredlight-sleeping-bag.jpg aptredlight-full-body-lamp.png; do
            test -s "assets/photos/$photo"
          done
      - name: Create deploy archive
        run: |
          zip -q -r aptredlight-live.zip index.html assets guides robots.txt sitemap.xml
          unzip -l aptredlight-live.zip
      - name: Store release archive in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f aptredlight-live.zip assets/photos/
          if ! git diff --cached --quiet; then
            git commit -m "Build static release archive [skip ci]"
            git push origin HEAD:main
          fi

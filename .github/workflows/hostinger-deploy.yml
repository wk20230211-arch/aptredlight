name: Deploy verified release to Hostinger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-deploy.yml'
      - '.hostinger/deploy.json'
      - 'tools/hostinger_deploy.py'
      - 'tools/test_hostinger_deploy.py'
      - 'tools/build_hostinger_manifest.py'
      - 'tools/verify_hostinger_identity.py'
      - 'tools/test_hostinger_identity.py'
      - 'tools/install_hostinger_public_key.py'
      - 'tools/test_hostinger_public_key.py'
      - 'setup/Connect-APTREDLIGHT.ps1'
      - 'setup/Connect-APTREDLIGHT-v2.ps1'
      - 'setup/WINDOWS-SETUP.zh-CN.txt'
      - 'tools/test_windows_key_acl.ps1'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-deploy.yml'
      - '.hostinger/deploy.json'
      - 'tools/hostinger_deploy.py'
      - 'tools/test_hostinger_deploy.py'
      - 'tools/build_hostinger_manifest.py'
      - 'tools/verify_hostinger_identity.py'
      - 'tools/test_hostinger_identity.py'
      - 'tools/install_hostinger_public_key.py'
      - 'tools/test_hostinger_public_key.py'
      - 'setup/Connect-APTREDLIGHT.ps1'
      - 'setup/Connect-APTREDLIGHT-v2.ps1'
      - 'setup/WINDOWS-SETUP.zh-CN.txt'
      - 'tools/test_windows_key_acl.ps1'
  workflow_run:
    workflows: ['Sync Sites release to production']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_run_id:
        description: Successful 'Sync Sites release to production' run containing hostinger-static-release
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: aptredlight-hostinger-production
  cancel-in-progress: false

jobs:
  validate-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Test release admission, overlay preservation and rollback
        run: |
          python3 tools/test_hostinger_deploy.py
          python3 tools/test_hostinger_identity.py
          python3 tools/test_hostinger_public_key.py
      - name: Check automation syntax
        run: python3 -m py_compile tools/hostinger_deploy.py tools/build_hostinger_manifest.py tools/verify_hostinger_identity.py tools/install_hostinger_public_key.py

      - name: Verify the Windows helper embeds the reviewed public-key installer
        run: |
          python3 - <<'PYCODE'
          import base64,pathlib,re,zlib
          assert pathlib.Path('setup/Connect-APTREDLIGHT-v2.ps1').read_bytes()==pathlib.Path('setup/Connect-APTREDLIGHT.ps1').read_bytes(),'Windows download alias drift'
          script=pathlib.Path('setup/Connect-APTREDLIGHT.ps1').read_text(encoding='utf-8-sig')
          match=re.search(r"\$InstallerBase64 = '([A-Za-z0-9+/=]+)'",script)
          assert match,'Missing embedded public-key installer'
          packed=base64.b64decode(match[1],validate=True)
          source=zlib.decompress(packed)
          assert source==pathlib.Path('tools/install_hostinger_public_key.py').read_bytes(),'Installer source drift'
          command="python3 -c 'import zlib;exec(zlib.decompress(bytes(["+','.join(map(str,packed))+"])))'"
          assert len(command)<=27000,'Windows SSH command is too long'
          PYCODE

  validate-windows-setup:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Parse the local setup script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $path = Join-Path $env:GITHUB_WORKSPACE 'setup\Connect-APTREDLIGHT.ps1'
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'The Windows setup script contains syntax errors.'
          }
          $bytes = [IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
            throw 'A UTF-8 BOM is required for Windows PowerShell 5.1.'
          }
          # Parse only: CI must never generate a real deployment key or authorize one.
          Write-Output 'Windows PowerShell 5.1 syntax and UTF-8 BOM passed; no setup was executed.'
      - name: Test private-key file ACL handling without SeSecurityPrivilege
        shell: powershell
        run: .\tools\test_windows_key_acl.ps1

  deploy:
    needs: [validate-automation, validate-windows-setup]
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.sync_run_id }}
    steps:
      # Deploy code is always taken from the trusted default branch, never from the artifact.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify the triggering release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request
          run_id=os.environ['SOURCE_RUN_ID'];assert re.fullmatch(r'[0-9]+',run_id),'Invalid release run ID'
          repo=os.environ['GITHUB_REPOSITORY']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'APTREDLIGHT-Deployment'})
          with urllib.request.urlopen(req,timeout=30) as response:run=json.load(response)
          assert run['name']=='Sync Sites release to production' and run['path']=='.github/workflows/sync-sites-production.yml'
          assert run['conclusion']=='success' and run['head_branch']=='main'
          assert run['repository']['full_name']==repo and run['head_repository']['full_name']==repo
          assert run['event'] in ['push','workflow_dispatch']
          PY
      - name: Download the exact verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: hostinger-static-release
          path: ${{ runner.temp }}/hostinger-release
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Admit only the currently pinned release
        run: >-
          python3 tools/hostinger_deploy.py validate
          --release "$RUNNER_TEMP/hostinger-release"
          --pointer .openai/site-release.json
          --receipt "$RUNNER_TEMP/hostinger-validation-receipt.json"
      - name: Resolve the confirmed Hostinger SSH target
        env:
          HOSTINGER_SSH_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib,re
          config=json.loads(pathlib.Path('.hostinger/deploy.json').read_text())
          pointer=json.loads(pathlib.Path('.openai/site-release.json').read_text())
          assert config['domain']=='aptredlight.com' and config['canonical_origin']=='https://www.aptredlight.com'
          assert config['project_id']==pointer['project_id']=='appgprj_6addb8c872b081918d711d7bc0c5cbf4'
          host=(os.environ.get('HOSTINGER_SSH_HOST') or config['ssh_host']).strip()
          port=int(os.environ.get('HOSTINGER_SSH_PORT') or config['ssh_port'])
          user=config['ssh_user'];web_root=config['web_root']
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]*',host),'Invalid SSH host'
          assert 1<=port<=65535 and user=='u469397229','Unexpected SSH port or user'
          assert web_root==f'/home/{user}/domains/aptredlight.com/public_html','Unexpected website root'
          with open(os.environ['GITHUB_ENV'],'a') as out:
              for key,value in [('DEPLOY_HOST',host),('DEPLOY_PORT',str(port)),('DEPLOY_USER',user),('DEPLOY_WEB_ROOT',web_root)]:out.write(key+'='+value+'\n')
          PYCODE
      - name: Verify the SSH server against the fingerprint supplied in hPanel
        run: |
          set -euo pipefail
          umask 077
          ssh-keyscan -T 10 -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" > "$RUNNER_TEMP/hostinger-known-hosts"
          ssh-keygen -lf "$RUNNER_TEMP/hostinger-known-hosts" -E sha256
          python3 tools/verify_hostinger_identity.py --config .hostinger/deploy.json --known-hosts "$RUNNER_TEMP/hostinger-known-hosts" --host "$DEPLOY_HOST" --port "$DEPLOY_PORT" --receipt "$RUNNER_TEMP/hostinger-identity-receipt.json"
      - name: Check the one-time deployment private key binding
        env:
          HAS_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY != '' }}
        run: |
          python3 - <<'PYCODE'
          import datetime,json,os,pathlib,sys
          pointer=json.loads(pathlib.Path('.openai/site-release.json').read_text())
          if os.environ.get('HAS_SSH_PRIVATE_KEY')!='true':
              receipt={'status':'needs_setup','deployed':False,'host_identity_verified':True,'sites_version':pointer['sites_version'],'source_commit':pointer['source_commit'],'missing':['secret HOSTINGER_SSH_PRIVATE_KEY'],'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              pathlib.Path(os.environ['RUNNER_TEMP'],'hostinger-deployment-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
              print('::error::Server identity verified. Add the matching deployment private key as GitHub secret HOSTINGER_SSH_PRIVATE_KEY; authorize its public key in Hostinger. See docs/hostinger-auto-deploy.zh-CN.md.')
              sys.exit(1)
          PYCODE
      - name: Load the deployment key and pinned SSH host identity
        env:
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          eval "$(ssh-agent -s)" > /dev/null
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" | ssh-add - > /dev/null
          printf 'SSH_AUTH_SOCK=%s\nSSH_AGENT_PID=%s\n' "$SSH_AUTH_SOCK" "$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Back up, overlay, verify the public site and roll back on failure
        run: >-
          python3 tools/hostinger_deploy.py deploy
          --release "$RUNNER_TEMP/hostinger-release"
          --pointer .openai/site-release.json
          --host "$DEPLOY_HOST"
          --port "$DEPLOY_PORT"
          --user "$DEPLOY_USER"
          --web-root "$DEPLOY_WEB_ROOT"
          --known-hosts "$RUNNER_TEMP/hostinger-known-hosts"
          --receipt "$RUNNER_TEMP/hostinger-deployment-receipt.json"
      - name: Retain deployment and verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-deployment-receipts
          path: |
            ${{ runner.temp }}/hostinger-validation-receipt.json
            ${{ runner.temp }}/hostinger-identity-receipt.json
            ${{ runner.temp }}/hostinger-deployment-receipt.json
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize the actual deployment state
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          path=pathlib.Path(os.environ['RUNNER_TEMP'],'hostinger-deployment-receipt.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Hostinger production deployment\n\n')
              if path.exists():out.write('```json\n'+json.dumps(json.loads(path.read_text()),ensure_ascii=False,indent=2)+'\n```\n')
              else:out.write('No production deployment receipt was produced. Check the failed step; this run does not prove the website was updated.\n')
          PY
      - name: Remove the ephemeral deployment key
        if: always()
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            ssh-add -D > /dev/null 2>&1 || true
            ssh-agent -k > /dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/hostinger-known-hosts"

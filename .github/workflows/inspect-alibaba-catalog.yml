name: Inspect official Alibaba category card assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-alibaba-catalog.yml'
  workflow_dispatch:
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Extract context around verified APTREDLIGHT manufacturer catalog listings
        run: |
          python -m pip -q install requests beautifulsoup4
          python - <<'PY'
          import requests,re,html
          urls = {
             'MASK': 'https://www.alibaba.com/category/led-mask_100001831.html',
             'MAT': 'https://www.alibaba.com/catalog/Red-Light-Therapy-Bed_cid202000203?sortType=prodSold180',
             'FACE': 'https://www.alibaba.com/wholesale/facial-led-light-mask.html',
             'PANELS': 'https://www.alibaba.com/category/red-light-therapy_202014001.html'
          }
          for label,url in urls.items():
            try:
              response=requests.get(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'},timeout=20)
              raw=response.text
              print('SOURCE',label,'HTTP',response.status_code,'LENGTH',len(raw),'APTREDLIGHT_COUNT',raw.lower().count('aptredlight'))
              matches=list(re.finditer(r'aptredlight',raw,re.I))
              for m in matches[:4]:
                s=html.unescape(raw[max(0,m.start()-1800):m.end()+1800])
                urls=re.findall(r'https?[^\s"\\<>]+?(?:\.jpg|\.webp|\.png)(?:[^\s"\\<>]*)',s)
                print('MATCH', label, 'TEXT',re.sub('<[^>]+>',' ',s)[:450].replace('\n',' '),'IMAGES',urls[:4])
            except Exception as e: print('ERROR',label,str(e)[:150])
          PY

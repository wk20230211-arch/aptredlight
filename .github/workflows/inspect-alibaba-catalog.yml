name: Inspect official Alibaba category card assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-alibaba-catalog.yml'
  workflow_dispatch:
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Extract context around verified APTREDLIGHT manufacturer catalog listings
        run: |
          python -m pip -q install requests beautifulsoup4
          python - <<'PY'
          import requests,re,html,json
          from bs4 import BeautifulSoup
          urls = {
             'MASK': 'https://www.alibaba.com/category/led-mask_100001831.html',
             'MAT': 'https://www.alibaba.com/catalog/Red-Light-Therapy-Bed_cid202000203?sortType=prodSold180',
             'FACE': 'https://www.alibaba.com/wholesale/facial-led-light-mask.html',
             'PANELS': 'https://www.alibaba.com/category/red-light-therapy_202014001.html'
          }
          for label,url in urls.items():
            try:
              response=requests.get(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'},timeout=20)
              raw=response.text
              needles = ['1601928813984','APTREDLIGHT 300 Led Mask Face','APTREDLIGHT Led Light Therapy Facial Mask']
              for needle in needles:
                for match in list(re.finditer(re.escape(needle),raw,re.I))[:2]:
                  s=raw[max(0,match.start()-900):match.start()+1200]
                  names=re.findall(r'originalFileName[^@]{0,200}',s)
                  links=re.findall(r'(?:image|img|fileName)[^\"\\]{0,160}',s,re.I)
                  print('CANDIDATE_CONTEXT',label,needle,'FILE_NAMES',names[:5],'IMAGES',links[:5],'SNIP',s[:1000].replace('\\\"','\"'))
              soup=BeautifulSoup(raw,'html.parser')
              for img in soup.find_all('img'):
                alt=img.get('alt','')
                if 'APTREDLIGHT' in alt.upper():
                  a=img.find_parent('a',href=True)
                  print('VERIFIED_CARD_CANDIDATE',label,'ALT',alt[:170],'IMG',str(img.get('src') or img.get('data-src'))[:240],'LINK',str(a.get('href') if a else '')[:180])
              for tag in soup.select('script[type="application/ld+json"]'):
                try: data=json.loads(tag.get_text())
                except: continue
                def walk(obj):
                  if isinstance(obj,dict):
                    if obj.get('@type') == 'Product' and 'APTREDLIGHT' in str(obj.get('name','')).upper():
                      print('CONFIRMED_STRUCTURED',label,'NAME',str(obj.get('name'))[:160],'IMAGE',str(obj.get('image'))[:260],'OFFER',str(obj.get('offers',{}).get('url',''))[:180])
                    for child in obj.values(): walk(child)
                  elif isinstance(obj,list):
                    for child in obj: walk(child)
                walk(data)
              print('SOURCE',label,'HTTP',response.status_code,'LENGTH',len(raw),'APTREDLIGHT_COUNT',raw.lower().count('aptredlight'))
              matches=list(re.finditer(r'aptredlight',raw,re.I))
              for m in matches[:4]:
                s=html.unescape(raw[max(0,m.start()-1800):m.end()+1800])
                urls=re.findall(r'https?[^\s"\\<>]+?(?:\.jpg|\.webp|\.png)(?:[^\s"\\<>]*)',s)
                print('MATCH', label, 'TEXT',re.sub('<[^>]+>',' ',s)[:450].replace('\n',' '),'IMAGES',urls[:4])
            except Exception as e: print('ERROR',label,str(e)[:150])
          PY

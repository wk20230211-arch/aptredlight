name: Prepare native WordPress owner setup
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/cms-owner-setup.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: aptredlight-hostinger-production
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: none
        tools: none
    - name: Verify owner guards and native handoff encryption boundaries
      run: |
        python3 tools/test_final_owner_setup.py
        python3 -m py_compile tools/final_owner_setup.py
        php -l integrations/wordpress/aptredlight-growth-desk/aptredlight-growth-desk.php
        php tests/wordpress-admin-bridge.php integrations/wordpress/aptredlight-growth-desk
        php tests/wordpress-admin-bridge.php integrations/wordpress/aptredlight-growth-desk --no-woo
  owner-setup:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Start a redacted owner setup receipt
      env:
        HAS_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY != '' }}
      run: |
        python3 - <<'PYCODE'
        import json,os,pathlib,sys
        ready=os.environ.get('HAS_SSH_PRIVATE_KEY')=='true'
        value={'schema':1,'status':'pending' if ready else 'needs_setup','cms_url':'https://www.aptredlight.com/cms','native_password_changed':False}
        pathlib.Path(os.environ['RUNNER_TEMP'],'cms-owner-setup-receipt.json').write_text(json.dumps(value,indent=2)+'\n')
        if not ready:sys.exit(1)
        PYCODE
    - name: Verify the fixed Hostinger target against its owner-pinned ED25519 identity
      env:
        HOSTINGER_SSH_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
        HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
      run: |
        python3 - <<'PY'
        import json,os,pathlib,subprocess,sys
        sys.path.insert(0,'tools')
        from verify_hostinger_identity import read_config,valid_host,valid_port,verify,write_receipt
        receipt=pathlib.Path(os.environ['RUNNER_TEMP'],'cms-owner-setup-receipt.json')
        try:
            config=read_config(pathlib.Path('.hostinger/deploy.json').resolve())
            host=valid_host((os.environ.get('HOSTINGER_SSH_HOST') or config['ssh_host']).strip())
            port=valid_port(int(os.environ.get('HOSTINGER_SSH_PORT') or config['ssh_port']))
            if config['ssh_user']!='u469397229' or config['web_root']!='/home/u469397229/domains/aptredlight.com/public_html':
                raise ValueError('fixed_scope_mismatch')
            value=subprocess.run(['ssh-keyscan','-T','10','-p',str(port),'-t','ed25519',host],capture_output=True,timeout=20,check=False)
            if value.returncode or len(value.stdout)>65536:raise ValueError('keyscan_failed')
            known=value.stdout.decode('utf-8')
            identity=verify(config,known,host,port)
            path=pathlib.Path(os.environ['RUNNER_TEMP'],'cms-known-hosts')
            path.write_text(known);path.chmod(0o600)
            write_receipt(pathlib.Path(os.environ['RUNNER_TEMP'],'cms-identity-receipt.json'),identity)
            with open(os.environ['GITHUB_ENV'],'a') as out:
                out.write('CMS_SSH_HOST='+host+'\nCMS_SSH_PORT='+str(port)+'\n')
            print(json.dumps(identity))
        except Exception:
            report=json.loads(receipt.read_text());report.update(status='blocked',reason='pinned_ssh_identity_not_verified')
            receipt.write_text(json.dumps(report,indent=2)+'\n')
            print('{"status":"blocked","reason":"pinned_ssh_identity_not_verified"}')
            sys.exit(1)
        PY
    - name: Load the existing deployment key in an ephemeral SSH agent
      env:
        HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      run: |
        set -euo pipefail
        umask 077
        eval "$(ssh-agent -s)" > /dev/null
        printf 'SSH_AUTH_SOCK=%s\nSSH_AGENT_PID=%s\n' "$SSH_AUTH_SOCK" "$SSH_AGENT_PID" >> "$GITHUB_ENV"
        if ! printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" | ssh-add - > /dev/null 2>&1; then
          python3 - <<'PY'
        import json,os,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'],'cms-owner-setup-receipt.json')
        r=json.loads(p.read_text());r.update(status='blocked',reason='deployment_key_not_loadable')
        p.write_text(json.dumps(r,indent=2)+'\n')
        print('{"status":"blocked","reason":"deployment_key_not_loadable"}')
        PY
          exit 1
        fi
    - name: Verify the installed CMS and encrypt the native owner setup link
      run: |
        python3 tools/final_owner_setup.py --known-hosts "$RUNNER_TEMP/cms-known-hosts" --public-key .hostinger/cms-receipt-public-key.pem --receipt "$RUNNER_TEMP/cms-owner-setup-receipt.json"
    - name: Preserve only encrypted owner setup and public identity receipts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: aptredlight-cms-owner-setup-attempt-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/cms-owner-setup-receipt.json
          ${{ runner.temp }}/cms-identity-receipt.json
        if-no-files-found: warn
        retention-days: 3
    - name: Remove the ephemeral SSH agent
      if: always()
      run: |
        if [ -n "${SSH_AGENT_PID:-}" ]; then
          ssh-add -D > /dev/null 2>&1 || true
          ssh-agent -k > /dev/null 2>&1 || true
        fi
        rm -f "$RUNNER_TEMP/cms-known-hosts"

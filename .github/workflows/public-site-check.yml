name: Public WWW domain and speed smoke test
# Recheck after removing the Hostinger loop-producing root redirect
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-site-check.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DNS resolution and redirect checks
        run: |
          set +e
          echo "=== DNS with multiple resolvers ==="
          for server in 1.1.1.1 8.8.8.8; do
            echo "Resolver: $server"
            for host in aptredlight.com www.aptredlight.com; do
              dig +time=4 +tries=1 @"$server" "$host" A +short
              dig +time=4 +tries=1 @"$server" "$host" CNAME +short
            done
          done
          echo "=== HTTP response headers and timing ==="
          for url in https://www.aptredlight.com/ https://aptredlight.com/ https://www.aptredlight.com/catalog.html https://www.aptredlight.com/quality-process.html https://www.aptredlight.com/assets/photos/touchscreen-panel-lifestyle-user.webp https://www.aptredlight.com/products/t300-ultra.html https://www.aptredlight.com/assets/photos/aptredlight-brand-banner.jpg https://www.aptredlight.com/assets/photos/alibaba-t300-family.webp https://www.aptredlight.com/assets/photos/alibaba-a13-family.webp https://www.aptredlight.com/assets/photos/alibaba-mask-family.webp https://www.aptredlight.com/assets/photos/aptredlight-full-body-lamp-optimized.webp; do
            echo "$url"
            curl --location --max-redirs 5 --max-time 25 -A 'APTREDLIGHT-public-site-audit/1.0' -sS -o /tmp/site_body -D /tmp/site_header -w 'final_http=%{http_code} final_url=%{url_effective} time_dns=%{time_namelookup} time_connect=%{time_connect} time_tls=%{time_appconnect} time_first_byte=%{time_starttransfer} time_total=%{time_total} download=%{size_download}\n' "$url"
            grep -Ei '^(HTTP/|location:|cache-control:|content-type:|content-encoding:|age:|server:)' /tmp/site_header | tail -15
            if [ "$url" = "https://www.aptredlight.com/" ]; then
              grep -o -m1 -E 'Red light therapy products\. Built for your brand\.|Build your next red light therapy product line\.|Red Light Therapy Solutions Built for Your Market' /tmp/site_body || :
            fi
          done
      - name: Strict WWW basic response assertion
        run: |
          curl -fsSL --max-redirs 5 --max-time 30 'https://www.aptredlight.com/?site-audit=20261115' -o /tmp/apt_home
          grep -Eiq 'APTREDLIGHT' /tmp/apt_home
          grep -Eiq 'Red light therapy products. Built for your brand.|Build your next red light therapy product line.' /tmp/apt_home
          grep -q 'assets/photos/alibaba-t300-family.webp' /tmp/apt_home
          grep -q 'assets/photos/alibaba-mask-family.webp' /tmp/apt_home
          grep -q 'assets/photos/touchscreen-panel-lifestyle-user.webp' /tmp/apt_home
          echo "WWW updated touchscreen hero reference verified"
          for photo in alibaba-t300-family.webp alibaba-a13-family.webp alibaba-mask-family.webp; do
            curl --fail -sSL --max-time 20 -o /tmp/$photo -w "$photo code=%{http_code} total=%{time_total} size=%{size_download} bytes\n" "https://www.aptredlight.com/assets/photos/$photo"
            test $(wc -c </tmp/$photo) -gt 10000
          done
          echo 'Official Alibaba product-family WebP images verified'
          curl -fsSL --max-time 25 'https://www.aptredlight.com/catalog.html' -o /tmp/apt_catalog
          grep -q 'Find the right product format' /tmp/apt_catalog
          grep -q 'T300 ULTRA' /tmp/apt_catalog
          grep -q 'MAT / SLEEPING BAG' /tmp/apt_catalog
          curl -fsSL --max-time 25 'https://www.aptredlight.com/quality-process.html' -o /tmp/apt_quality
          grep -q 'Incoming component verification' /tmp/apt_quality
          grep -q 'Packing & repeat-order handover' /tmp/apt_quality
          echo 'PUBLIC CATALOG AND QUALITY PAGES VERIFIED'
